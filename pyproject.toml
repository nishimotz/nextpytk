[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "nextpytk"
version = "0.4.14"
description = "Accessible, declarative Tkinter applications from ordinary Python functions."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Takuya Nishimoto" }]
keywords = ["tkinter", "ttk", "gui", "accessibility", "declarative-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nishimotz/nextpytk"
Repository = "https://github.com/nishimotz/nextpytk"
Issues = "https://github.com/nishimotz/nextpytk/issues"
Changelog = "https://github.com/nishimotz/nextpytk/blob/main/CHANGES.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nextpytk"]

[tool.hatch.build.targets.sdist]
include = ["src/nextpytk", "README.md", "CHANGES.md"]

[tool.uv]
package = true
# uv-managed 3.14 doesn't bundle Tcl/Tk, so Tk startup fails.
# Prefer the system (Homebrew) Python. To run with free-threading,
# explicitly specify `uv run --python 3.14+freethreaded`.
python-preference = "system"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
