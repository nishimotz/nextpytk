name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install system Tk (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python-tk@${{ matrix.python }} || true
          # Homebrew's tcl-tk is versioned on disk (lib/tcl9.1/init.tcl), so
          # exporting TCL_LIBRARY=<prefix>/lib makes Tk fail with "Cannot find
          # a usable init.tcl". Probe first and only override when the
          # interpreter needs it, pointing at the versioned directories.
          probe_log="${RUNNER_TEMP}/tk-probe.log"
          if uv run --python ${{ matrix.python }} python -c 'import tkinter; tkinter.Tk().destroy()' >"$probe_log" 2>&1; then
            echo "Tk starts without TCL_LIBRARY/TK_LIBRARY; leaving them unset."
            exit 0
          fi
          if ! grep -q "init.tcl" "$probe_log"; then
            echo "Tk is unusable for Python ${{ matrix.python }} and not because of init.tcl:" >&2
            cat "$probe_log" >&2
            exit 1
          fi
          tk_lib="$(brew --prefix tcl-tk)/lib"
          tcl_dir="$(dirname "$(find "$tk_lib" -maxdepth 2 -name init.tcl | sort -V | tail -1)")"
          tk_dir="$(dirname "$(find "$tk_lib" -maxdepth 2 -name tk.tcl | sort -V | tail -1)")"
          echo "Using TCL_LIBRARY=$tcl_dir TK_LIBRARY=$tk_dir"
          echo "TCL_LIBRARY=$tcl_dir" >> "$GITHUB_ENV"
          echo "TK_LIBRARY=$tk_dir" >> "$GITHUB_ENV"
      - name: Install system Tk and Xvfb (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Run pytest (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          PYTEST_CURRENT_TEST: ""
        # A bare ubuntu-latest runner has no X display, so every Tk test is
        # skipped via `requires_display`. Run under Xvfb so the GUI suite
        # actually executes on Linux instead of silently skipping.
        run: xvfb-run -a uv run --python ${{ matrix.python }} pytest -q
      - name: Run pytest (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          PYTEST_CURRENT_TEST: ""
        run: uv run --python ${{ matrix.python }} pytest -q

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run pyright
        run: uv run --python 3.14 pyright src/nextpytk/

  build:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build --python 3.14
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Test install and import
        run: |
          uv run --python 3.14 --with pip python -m pip install dist/*.whl --force-reinstall
          uv run --python 3.14 python -c "from importlib.metadata import version; print(version('nextpytk'))"

  readme-example:
    name: README Quick Start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run README Quick Start
        env:
          DISPLAY: ":99"
        run: |
          sudo apt-get update
          # `uv run --python 3.14` resolves to /usr/bin/python3.14 on
          # ubuntu-latest, which has no tkinter without python3-tk.
          sudo apt-get install -y python3-tk xvfb
          cat > /tmp/readme_quick_start.py <<'EOF'
          from nextpytk import TkApp

          app = TkApp(title="Hello")

          @app.status("msg")
          def msg():
              return "Hello, world!"

          @app.button("greet", label="Greet")
          def on_greet():
              return {"msg": "Button clicked!"}

          app.run(
              layout=["msg", "greet"],
              on_ready=lambda a: (a.root.withdraw(), a.root.after(50, a.root.destroy)),
          )
          EOF
          xvfb-run uv run --python 3.14 python /tmp/readme_quick_start.py
