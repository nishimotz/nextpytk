name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install system Tk (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python-tk@${{ matrix.python }} || true
          echo "/opt/homebrew/opt/tcl-tk/bin" >> "$GITHUB_PATH"
          echo "TK_LIBRARY=/opt/homebrew/opt/tcl-tk/lib" >> "$GITHUB_ENV"
          echo "TCL_LIBRARY=/opt/homebrew/opt/tcl-tk/lib" >> "$GITHUB_ENV"
      - name: Run pytest
        env:
          PYTEST_CURRENT_TEST: ""
        run: uv run --python ${{ matrix.python }} pytest -q

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run pyright
        run: uv run --python 3.14 pyright src/nextpytk/

  build:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build --python 3.14
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Test install and import
        run: |
          uv run --python 3.14 --with pip python -m pip install dist/*.whl --force-reinstall
          uv run --python 3.14 python -c "from importlib.metadata import version; print(version('nextpytk'))"

  readme-example:
    name: README Quick Start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run README Quick Start
        env:
          DISPLAY: ":99"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          cat > /tmp/readme_quick_start.py <<'EOF'
          from nextpytk import TkApp

          app = TkApp(title="Hello")

          @app.status("msg")
          def msg():
              return "Hello, world!"

          @app.button("greet", label="Greet")
          def on_greet(values):
              return {"msg": "Button clicked!"}

          app.run(
              layout=["msg", "greet"],
              on_ready=lambda a: (a.root.withdraw(), a.root.after(50, a.root.destroy)),
          )
          EOF
          xvfb-run uv run --python 3.14 python /tmp/readme_quick_start.py
