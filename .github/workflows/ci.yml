name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run pytest
        run: uv run --python ${{ matrix.python }} pytest -q

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run pyright
        run: uv run --python 3.14 pyright src/nextpytk/

  build:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build --python 3.14
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Test install and import
        run: |
          uv run --python 3.14 -m pip install dist/*.whl --force-reinstall
          uv run --python 3.14 python -c "import nextpytk; print(nextpytk.__version__)"

  readme-example:
    name: README Quick Start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run README Quick Start
        run: |
          cat > /tmp/readme_quick_start.py <<'EOF'
          from nextpytk import TkApp

          app = TkApp(title="Hello")

          @app.status("msg")
          def msg():
              return "Hello, world!"

          @app.button("greet", label="Greet")
          def on_greet(values):
              return {"msg": "Button clicked!"}

          app.run(
              layout=["msg", "greet"],
              on_ready=lambda a: (a.root.withdraw(), a.root.after(50, a.root.destroy)),
          )
          EOF
          uv run --python 3.14 python /tmp/readme_quick_start.py
